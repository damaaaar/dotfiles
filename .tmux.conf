# Cambiar entre paneles
setw -g mode-keys vi
bind-key j select-pane -L
bind-key k select-pane -D
bind-key i select-pane -U
bind-key l select-pane -R

# Mouse
set -g mouse on

# Colores
set -g default-terminal "tmux-256color"

# Recargar configuración
bind r source-file ~/.tmux.conf \; display "Configuración recargada"

# Más historial
set -g history-limit 50000

# Ventanas numeradas desde 1
set -g base-index 1
setw -g pane-base-index 1

# Recarga automática al guardar
set-option -g focus-events on

# Habilitar colores de 24 bits
set -ga terminal-overrides ",*:Tc"

# Reducir el retardo de Escape (mejora la sensación al usar Vim/Neovim)
set -sg escape-time 10

# Mantener sincronizado el portapapeles del sistema (Ghostty lo soporta)
set -s set-clipboard on

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'

# Tema
set -g @plugin 'nordtheme/tmux'

run '~/.tmux/plugins/tpm/tpm'
